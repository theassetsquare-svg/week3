<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="robots" content="noindex,follow"/>
  <title>페이지를 찾을 수 없어요 (404) — 놀쿨</title>
  <meta name="description" content="요청하신 페이지를 찾을 수 없습니다. 주소가 바뀌었거나 삭제된 페이지일 수 있어요. 홈에서 전국 나이트·클럽·라운지·룸·요정·호빠 정보를 다시 찾아보세요."/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
      background:#0F1222;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.7}
    .wrap{max-width:520px;text-align:center}
    .code{font-size:84px;font-weight:900;letter-spacing:-2px;color:#8B5CF6;line-height:1}
    h1{font-size:22px;font-weight:800;margin:16px 0 10px}
    p{font-size:15px;color:#C7CBD9;margin-bottom:24px}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a.btn{display:inline-block;padding:14px 26px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;min-height:44px}
    a.home{background:#8B5CF6;color:#fff}
    a.main{background:#22C55E;color:#0F1222}
    .logo-text{font-weight:300;letter-spacing:0.05em}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <h1>찾으시는 페이지가 없어요</h1>
    <p>주소가 바뀌었거나 삭제된 페이지일 수 있습니다.<br/>아래에서 다시 찾아보세요.</p>
    <div class="btns">
      <a class="btn home" href="/"><span class="logo-text">놀쿨</span> 홈으로</a>
      <a class="btn main" href="https://nolcool.com" target="_blank" rel="noopener noreferrer">놀쿨에서 전체 보기 &rarr;</a>
    </div>
  </main>
</body>
</html>
